#   min_obs         = 150  # minimum weeks of history before z is valid
#   crowded_z       = 1.5  # |z| > 1.5 = crowded state
#
# CONC_TOP4 (squeeze tell — HG/GC): threshold on conc_gross_le_4_tdr_long
# (Disagg; unit = % of gross OI). Only set for Disagg contracts; TFF
