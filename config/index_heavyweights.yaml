# =====================================================================================
# ark-watch — config/index_heavyweights.yaml
# Index heavyweight constituents + approximate weights for the earnings-week
# gauge (FMP earnings calendar → "how much of the index reports this week").
#
# WHY APPROXIMATE: index weights drift daily with prices. The signal is
# coarse by design (does ~40% of the index report this week or not) and is
# robust to ±1pp weight errors. Refresh quarterly against the latest
# SPDR/Invesco fund factsheets.
#
# [RISET: weights are approximate as of 2026-09 (order verified; pp-level
#  values rounded from fund-factsheet order of magnitude); refresh quarterly]
# =====================================================================================

