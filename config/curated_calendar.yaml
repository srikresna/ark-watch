# ============================================================================
# ark-watch — config/curated_calendar.yaml
# Curated calendar: authoritative for exact RELEASE TIMES. Union calendars
# (FMP/EODHD/TV) only complete the event list; when times conflict, this
# file wins. Quarterly refresh.
#
# Conventions:
#   - All times are ET, 24h "HH:MM" format.
#   - WIB = ET + 11 during EDT (Mar~Nov) / ET + 12 during EST — the conversion
#     is season-aware in code, never hard-coded. Beware midnight crossings
#     (FOMC 14:00 ET = 01:00 WIB the NEXT day during EDT).
#   - "00:00" in union sources = DATE-ONLY (not a midnight release); TV
#     "Symposium" rows with 00:00 are ignored.
#   - Rows derived from this file land in `events` with is_curated=1.
#
# Release-time precedence (on conflicts): curated (this file) > TV > CME >
# FMP > EODHD
# ============================================================================

source_precedence:
  - curated        # this config — authoritative for times
  - tv             # tradingview economic-calendar (main source of precise times for speeches)
  - cme            # CME calendar
  - fmp            # /stable/economic-calendar
  - eodhd          # /economic-events (verification only)

# ---------------------------------------------------------------------------
# (a) STANDARD RELEASE TIMES (ET) — official publisher schedules
# ---------------------------------------------------------------------------
release_times:
  - event: bls_cpi                  # Consumer Price Index
    time_et: "08:30"
    provenance: "Official schedule — web-search verified 2026-08-31, bls.gov/schedule/news_release/cpi.htm"
  - event: bls_nfp                  # Employment Situation (payrolls + unemployment)
    time_et: "08:30"
    note: "usually the first Friday of the month"
    provenance: "Official schedule — web-search verified 2026-08-31, bls.gov/schedule"
  - event: bls_ppi                  # Producer Price Index
    time_et: "08:30"
    provenance: "Official schedule — web-search verified 2026-08-31, bls.gov/schedule/news_release/ppi.htm"
  - event: ism_mfg                  # ISM Manufacturing PMI
    time_et: "10:00"
    provenance: "Official schedule — web-search verified 2026-08-31, ismworld.org supply management survey schedule"
  - event: ism_services             # ISM Services PMI
    time_et: "10:00"
    provenance: "Official schedule — web-search verified 2026-08-31, ismworld.org supply management survey schedule"
  - event: umich_sentiment          # UMich consumer sentiment (prelim & final)
    time_et: "10:00"
    provenance: "Official schedule — web-search verified 2026-08-31, data.sca.isr.umich.edu release schedule"
  - event: bea_gdp                  # BEA GDP advance/second/third + quarterly PCE
    time_et: "08:30"
    provenance: "Official schedule — web-search verified 2026-08-31, bea.gov news release schedule"
  - event: dol_initial_claims       # Initial jobless claims
    time_et: "08:30"
    day: Thursday
    provenance: "Official schedule — web-search verified 2026-08-31, dol.gov/ui/data.jsp + bls.gov schedule"
  - event: fomc_statement           # FOMC policy statement (day 2 of the meeting)
    time_et: "14:00"
    provenance: "Official schedule — web-search verified 2026-08-31, federalreserve.gov/newsevents/calendar.htm"
  - event: fomc_presser             # Fed Chair press conference
    time_et: "14:30"
    note: "30 minutes after the statement; applies to ALL regular 2-day meetings (practice since 2011)"
    provenance: "Official schedule — web-search verified 2026-08-31, federalreserve.gov (calendar + confirmation via official Fed channels)"
  - event: fomc_minutes             # FOMC minutes
    time_et: "14:00"
    note: "Wednesday, ~3 weeks after the meeting"
    provenance: "Official schedule — web-search verified 2026-08-31, federalreserve.gov/newsevents/calendar.htm"
  - event: jackson_hole_keynote     # Jackson Hole symposium keynote
    time_et: "10:00"
    day: Friday
    provenance: "Official schedule — web-search verified 2026-08-31, kc.frb.org symposium agenda + DATA-SPEC §9"

# ---------------------------------------------------------------------------
