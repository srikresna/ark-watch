  provenance: "Accessed 2026-08-31, federalreserve.gov/monetarypolicy/fomccalendars.htm — Future Years section"
  meetings:
    - dates: ["2027-01-26", "2027-01-27"]
      sep: false
    - dates: ["2027-03-16", "2027-03-17"]
      sep: true
    - dates: ["2027-04-27", "2027-04-28"]
      sep: false
    - dates: ["2027-06-08", "2027-06-09"]
      sep: true
    - dates: ["2027-07-27", "2027-07-28"]
      sep: false
    - dates: ["2027-09-14", "2027-09-15"]
