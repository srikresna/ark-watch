# ---------------------------------------------------------------------------
# (d) ANNUAL RECURRING EVENTS
# ---------------------------------------------------------------------------
recurring:
  jackson_hole:
    organizer: "Federal Reserve Bank of Kansas City"
    pattern: "late August, Thursday-Saturday"
    keynote: "Friday 10:00 ET"
    next_exact_dates: null          # TBA on kc.frb.org — check every July
    provenance: "Official pattern — web-search verified 2026-08-31, kc.frb.org symposium; exact per-year dates MUST be re-verified"

  treasury_quarterly_refunding:
    pattern: "QRA: Wednesday (early/mid) Feb / May / Aug / Nov"
    announcement_time_et: "08:30"   # financing details released the same day at 08:30 ET
    marketable_borrowing_estimates: "Wednesday of the prior week (radar bonus)"
    dates_2026:
      - "2026-02-04"                # past — archive
      - "2026-05-06"                # past — archive
      - "2026-08-05"                # past — archive
      - "2026-11-04"                # NEXT
    dates_2027: null                # not yet published by Treasury — do not extrapolate
                              # the quarterly-Wednesday pattern unlabeled
    provenance: "Web-search verified 2026-08-31, home.treasury.gov/policy-issues/financing-the-government/quarterly-refunding + press release 'next quarterly refunding announcement'"

# ---------------------------------------------------------------------------
