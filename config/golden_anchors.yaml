# ============================================================================
# ark-watch — config/golden_anchors.yaml
# Golden anchors: point-in-time verification snapshots used as the source
# verification gate. PK = (series_id, anchor_date).
#
# Conventions:
#   - Values are point-in-time snapshots; quarterly recalibration replaces
#     rows with fresh anchors rather than editing them.
#   - `provenance` records where each value was verified.
#   - For series with publication lag (H.10/H.15/H.4.1/ACM/NFCI/fiscal DTS),
#     anchor_date = the latest observation date available at fetch time, so the
#     verification date can be later than anchor_date.
#
# Tolerance is ABSOLUTE, in the same unit as `expected` (not a percentage).
# One-line rationale on each row. Principle: tolerance absorbs source rounding
# + mild vintage drift — it is not a substitute for sanity ranges.
# CVOL rows are live prints (no history exists) — GCVL is locked the
# tightest (0.01).
# ============================================================================

